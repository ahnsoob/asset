[project]
name = "dart-dcf"
version = "0.1.0"
description = "DART 공시 데이터 기반 DCF 밸류에이션"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["dcf"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
